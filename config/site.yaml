# Site basis -- Khomas Hochland highland ridge, near Windhoek, Namibia.
#
# This file is the single version-controlled
# source for every site quantity: nothing downstream hard-codes a site value.
#
# Read only through `src/config` (config.load_site()). Nothing else in the
# repo opens this file.
#
# Fields whose value is a `TODO:` string are UNRESOLVED. The loader turns them
# into a sentinel that raises on any use -- it never substitutes a placeholder
# number. A fabricated wind resource propagates silently into every AEP figure
# downstream, so these stayed TODO until a real extraction was supplied.
#
# The wind resource was resolved on 2026-09-13 and `gwa_area` was not; see the
# notes on each below for why that is a substantive distinction and not an
# oversight.

name: khomas-hochland
description: >-
  Highland ridge site near Windhoek, Namibia. Design basis for the SG6043
  design rotor. Not used by the NREL Phase VI validation rotor, which runs at
  its own sea-level condition -- see rotor_phase_vi.yaml.

# ---------------------------------------------------------------------------
# Location
# ---------------------------------------------------------------------------
# Elevation remains a working assumption. It was to be
# refined once the GWA area was selected -- and since no area selection
# happened (see gwa_area below), it has not been. 1800 m is consistent with
# the pinned coordinates on the Khomas Hochland plateau, but it is still an
# assumption and the atmosphere derived from it inherits that.
#
# Coordinates from a pinned point, 2026-09-13
# (`verification/wind_resource/site-location-regional.png`, and three closer
# views that arrived with it): 22 deg 25' 40.7" S, 16 deg 33' 28.2" E -> -22.427972, +16.557833.
# Khomas Hochland highland bush savanna west of Windhoek, which is the site
# this file has always described.
#
# LONGITUDE SIGN, recorded rather than silently resolved: the GASP panel
# labels the same point "W16.558". West 16.558 is in the South Atlantic, ~800
# km off Namibia's coast, and the panel's own terrain-derived wind statistics
# could not have been computed there. The pinned satellite views are
# unambiguous and agree with the site description, so EAST is recorded and the
# GASP label is treated as a display artefact of that tool. See
# `verification/wind_resource/README.md`; nothing downstream reads latitude or longitude today.
#
# `gwa_area` REMAINS TODO. It is not a formatting gap: the extraction supplied
# is a single POINT from GASP, not an area average from globalwindatlas.info,
# so there is no area selection to record. Filling it with the point's
# coordinates would assert an extraction that was never performed.
location:
  gwa_area: "TODO: no area selection exists -- the 2026-09-13 extraction was a GASP point, not a GWA area"
  latitude_deg: -22.427972   # 22 deg 25' 40.7" S
  longitude_deg: 16.557833   # 16 deg 33' 28.2" E -- see the note above
  elevation_m: 1800.0        # ~1800 m AMSL, assumed pending area selection
  hub_height_m: 20.0         # typical free-standing tower for this rotor class

# ---------------------------------------------------------------------------
# Atmosphere -- a headline result of the site choice
# ---------------------------------------------------------------------------
# Pressure from the ISA barometric relation at `elevation_m`:
#
#     p = p0 * (1 - L*h/T0)^(g/(Rs*L))
#     p0 = 101325 Pa, L = 0.0065 K/m, T0 = 288.15 K,
#     Rs = 287.05 J/(kg K), g = 9.80665 m/s^2, exponent = 5.25593
#
# Density from the ACTUAL annual-mean site temperature, not the ISA
# temperature at that altitude -- Namibia's interior is far warmer than ISA
# predicts, and that difference is the whole point of section 1.2:
#
#     rho = p / (Rs * T),  T = 293.15 K (20 C annual mean)
#     nu  = mu / rho
#
# The loader recomputes all three from `standard_atmosphere` + `temperature_k`
# + `dynamic_viscosity_pa_s` and rejects the file if the recorded values
# disagree by more than 0.5 %. They are recorded rather than only derived
# because they are reported numbers ("where a step produces a number that
# feeds a later step, that number is written to the
# config file").
#
# NOTE, deliberately left visible: my early project plan quoted
# rho = 0.98 kg/m^3 and nu = 1.85e-5 m^2/s. Recomputing from the stated
# constants gives 0.9684 and 1.869e-5 -- 1.2 % and 1.1 % away. The recomputed
# values are recorded; the earlier pair appears to be rounded. Both sit inside
# the 0.95-1.03 kg/m^3 sanity range. Not silently averaged or tuned.
atmosphere:
  temperature_k: 293.15              # annual mean, 20 C (site design value)
  pressure_pa: 81489.03              # barometric relation at 1800 m
  air_density: 0.96839               # rho = p / (Rs * T)
  dynamic_viscosity_pa_s: 1.81e-5    # mu at 20 C
  kinematic_viscosity: 1.8690e-5     # nu = mu / rho
  standard_atmosphere:
    sea_level_pressure_pa: 101325.0
    sea_level_temperature_k: 288.15
    lapse_rate_k_per_m: 0.0065
    specific_gas_constant: 287.05
    gravity: 9.80665

# ---------------------------------------------------------------------------
# Wind resource -- NEVER INVENTED.
# ---------------------------------------------------------------------------
# RESOLVED 2026-09-13. Read `verification/wind_resource/README.md` before
# using or quoting these numbers -- they are extrapolated, not extracted, and
# the distinction is load-bearing.
#
# Source: a GASP single-point extraction, 2026-09-13
# (`verification/wind_resource/gasp-point-data-50m.png`), reporting the omni-
# directional
# pair at **50 m**: A = 8.8 m/s, k = 1.87, U = 7.8 m/s. NOT
# globalwindatlas.info, which is what the plan originally named; that
# substitution is recorded in verification/wind_resource/README.md.
#
# The extraction is at 50 m and this rotor's hub is at 20 m, so both
# parameters were extrapolated down by the Justus & Mikhail (1976)
# correlation -- see `src/objective/height_extrapolation.py` for the method
# and its open provenance item, and `verification/wind_resource/` for the
# recorded calculation, its log-law cross-check, and the two disagreements
# with my prior expectation.
#
# `k ~ 1.8-2.4, c ~ 6-7 m/s` was my prior expectation, for
# sanity-checking an extraction only. THE RESULT SITS OUTSIDE IT ON BOTH
# COUNTS -- k is 0.09 low and c is 0.27 m/s high. The band is a prior, not a
# specification: it is neither widened to admit the result nor used to adjust
# it. The site is simply windier and its distribution broader than I
# guessed, and the consequences of that are followed through in
# the AEP figures rather than suppressed here.
wind_resource:
  weibull_k: 1.709226        # extrapolated 50 m -> 20 m, from k = 1.87
  weibull_c_ms: 7.273759     # extrapolated 50 m -> 20 m, from A = 8.8 m/s
  mean_wind_speed_ms: 6.487612   # derived, V_bar = c * Gamma(1 + 1/k)
