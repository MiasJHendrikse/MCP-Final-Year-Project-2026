# Design rotor -- the Khomas Hochland small turbine, the actual optimisation
# study subject (PROJECT_PLAN.md sections 1.4, 2.2, 4).
#
# This rotor's air properties are NOT here: they are site properties and live
# in site.yaml. Anything solving this rotor takes rho and nu from the site
# config. That separation is the point of the file -- a rotor config that
# carried its own density would reintroduce exactly the hard-coded-site-value
# problem plan item 1.1 exists to remove.
#
# Read only through `src/config` (config.load_design_rotor()).

name: khomas-hochland-3kw
description: >-
  3-bladed, 2.0 m radius, SG6043 small wind turbine for a low-wind-speed
  highland site. Optimised in Phases 2-5; never used to validate the solver.

geometry:
  radius_m: 2.0          # FIXED, not a design variable. Set by polar
                         # validation quality, not by a power target -- plan
                         # section 1.5.
  n_blades: 3

  # Inboard end of the bladed span, as a fraction of R. A conventional root
  # cut-out for a rotor this size, and a MODELLING CHOICE rather than a
  # measured or derived quantity -- flagged in docs/OUTSTANDING-INPUTS.md for
  # confirmation.
  #
  # It is recorded here because it is already load-bearing and was previously
  # duplicated: `polars/envelope.py` carried its own `_ROOT_FRACTION = 0.15`
  # when it sized the SG6043 cache's Reynolds bounds (work order Task 2), and
  # plan step 1.6's parameterisation needs the same span. Two copies of a
  # number that must agree is how they stop agreeing, so there is now one.
  root_fraction: 0.15

operating:
  design_tsr: 6.5
  rated_wind_speed_ms: 11.0     # ~1.9 * V_bar, standard for low-wind machines
  cut_in_wind_speed_ms: 3.0     # deliberately low for a low-wind site
  cut_out_wind_speed_ms: 20.0

  # Generator rating, W (aerodynamic shaft power -- no drivetrain efficiency
  # is applied anywhere in the objective). Above rated the objective holds
  # power at THIS number, not at whatever the current blade happens to make at
  # 11 m/s. A nameplate does not get bigger because the blade got better;
  # letting it float credited the optimiser with a larger generator, and that
  # was worth 0.096 of the +0.217 % floating-cap gain (docs/AEP_GAIN_AUDIT.md
  # section 1.2, section 3.2).
  #
  # PROVISIONAL BASIS, recorded so it can be checked, not chosen: this is
  # P_aero(11 m/s; x0), the Schmitz baseline's own aerodynamic power at the
  # rated wind speed under the design TSR and the site atmosphere
  # (verification/baseline/x0.json), at full precision so the baseline's AEP
  # is unchanged by the switch. tests/test_baseline.py asserts the agreement
  # and is retired when a nameplate lands. It stands in for the generator's
  # nameplate rating, which is outstanding input B2 (docs/OUTSTANDING-INPUTS.md
  # section 9). When B2 is answered this value is replaced and every
  # optimisation artefact re-runs; nothing here should be read as "the
  # machine is a 3.8 kW machine".
  rated_power_w: 3822.189755449124

# ---------------------------------------------------------------------------
# Parameterisation -- plan section 4
# ---------------------------------------------------------------------------
# Strip count and design-variable count are independent quantities (section
# 4.1); both are recorded so they cannot be conflated by a downstream reader.
# The counts below are the plan's INTENDED configuration -- 25 strips, 10
# geometry parameters. Section 4.3 requires the control-point count to be
# selected by a documented representation study (6/8/10/12/16) rather than
# asserted, so these are the starting configuration for that study, not its
# conclusion.
#
# The bounds are TODO on purpose. Plan section 7.1 fixes only that chord and
# twist bounds exist and are applied to the SCALED variables; it commits to no
# numbers, and no study has selected any. Inventing a manufacturability
# envelope here would be exactly the failure mode ground rule 3 forbids: a
# number with no basis that silently constrains every optimisation result
# downstream.
parameterisation:
  n_bem_strips: 25
  n_control_points_chord: 5
  n_control_points_twist: 5
  bounds:
    chord_min_m: "TODO: manufacturability/root-attachment study (plan 7.1)"
    chord_max_m: "TODO: manufacturability/solidity study (plan 7.1)"
    twist_min_deg: "TODO: physically realistic range (plan 7.1)"
    twist_max_deg: "TODO: physically realistic range (plan 7.1)"

# Sanity band for the AEP module (plan section 1.4). A result far outside this
# indicates a bug, not a discovery. Recorded so the check reads it rather than
# restating it.
#
# WIDENED 4-6 -> 8-12 MWh/yr on 2026-09-13, ON MJ'S EXPLICIT INSTRUCTION, after
# the wind resource landed and the band could be evaluated for the first time.
# The baseline returns 10.27 MWh/yr. MJ's reasoning, recorded as given: if the
# blade already makes substantially more power than the original band, the
# original band was simply too narrow.
#
# This is a deliberate revision of a stated expectation, which the repo's
# ground rule 5 otherwise forbids -- so the basis is written out here rather
# than left as a pair of round numbers.
#
# WHY 4-6 WAS WRONG. Two independent defects, both predating the 2026-09-13
# data:
#
#   1. It compared different quantities. 4-6 came from a capacity factor of
#      0.15-0.22 on plan 1.4's ~3.1 kW rating, and that rating carries
#      `eta = 0.90` and assumes `Cp = 0.42`. The AEP model produces
#      AERODYNAMIC shaft energy -- src/objective/power.py applies no generator,
#      gearbox or electrical efficiency and says so -- at the solver's actual
#      design-point `Cp` of 0.472. Rated aerodynamic power is 3.82 kW, not
#      3.1 kW.
#   2. It was never consistent with plan 1.3's own resource prior. At the
#      CALMEST corner of `k ~ 1.8-2.4, c ~ 6-7 m/s` this rotor already returns
#      5.9 MWh/yr, and at the middle of that range 7.7. The band could not have
#      been met by the design it was written for, under the resource the same
#      plan expected. Nobody noticed because the resource was TODO, so the band
#      was never once evaluated.
#
# HOW 8-12 WAS DERIVED -- not chosen to admit 10.27:
#
#   Lower/upper from the resource uncertainty this project has actually
#   recorded. Varying the site pair by +/-10 % on both `c` and `k` spans
#   8.21-12.01 MWh/yr; the log-law roughness band on the height extrapolation
#   (c = 7.049-7.633 m/s at 20 m, verification/wind_resource/) spans
#   9.73-11.10 and sits comfortably inside. Rounded outward to 8-12.
#
#   Equivalent capacity factor 0.24-0.36 on the 3.82 kW aerodynamic rating.
#
# IT IS STILL A CHECK, WHICH IS THE POINT OF WIDENING IT CAREFULLY. Verified
# against plausible failure modes -- each of these lands OUTSIDE 8-12:
#
#     rated-power limiting not applied      14.63
#     sea-level density used (1.225)        ~12.99
#     bin masses not from the CDF           12.86
#     any factor-of-two error                5.14 or 20.54
#
# A band wide enough to admit anything would be a note, not a check. This one
# still fails on every bug the old one would have caught.
#
# WHAT IT DOES NOT SETTLE: whether the Phase 1 exit criterion should be stated
# in aerodynamic or delivered electrical energy. This band is aerodynamic,
# matching what the model computes. If the report wants electrical, an `eta`
# has to enter the chain and this band moves with it. See
# docs/OUTSTANDING-INPUTS.md and the 2026-09-13 journal entry.
sanity:
  aep_mwh_per_year_min: 8.0
  aep_mwh_per_year_max: 12.0
