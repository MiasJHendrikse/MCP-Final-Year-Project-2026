# Design rotor -- the Khomas Hochland small turbine, the actual optimisation
# study subject (PROJECT_PLAN.md sections 1.4, 2.2, 4).
#
# This rotor's air properties are NOT here: they are site properties and live
# in site.yaml. Anything solving this rotor takes rho and nu from the site
# config. That separation is the point of the file -- a rotor config that
# carried its own density would reintroduce exactly the hard-coded-site-value
# problem plan item 1.1 exists to remove.
#
# Read only through `src/config` (config.load_design_rotor()).

name: khomas-hochland-3kw
description: >-
  3-bladed, 2.0 m radius, SG6043 small wind turbine for a low-wind-speed
  highland site. Optimised in Phases 2-5; never used to validate the solver.

geometry:
  radius_m: 2.0          # FIXED, not a design variable. Set by polar
                         # validation quality, not by a power target -- plan
                         # section 1.5.
  n_blades: 3

  # Inboard end of the bladed span, as a fraction of R. A conventional root
  # cut-out for a rotor this size, and a MODELLING CHOICE rather than a
  # measured or derived quantity -- flagged in docs/OUTSTANDING-INPUTS.md for
  # confirmation.
  #
  # It is recorded here because it is already load-bearing and was previously
  # duplicated: `polars/envelope.py` carried its own `_ROOT_FRACTION = 0.15`
  # when it sized the SG6043 cache's Reynolds bounds (work order Task 2), and
  # plan step 1.6's parameterisation needs the same span. Two copies of a
  # number that must agree is how they stop agreeing, so there is now one.
  root_fraction: 0.15

operating:
  design_tsr: 6.5
  rated_wind_speed_ms: 11.0     # ~1.9 * V_bar, standard for low-wind machines
  cut_in_wind_speed_ms: 3.0     # deliberately low for a low-wind site
  cut_out_wind_speed_ms: 20.0

  # Generator rating, W (aerodynamic shaft power -- no drivetrain efficiency
  # is applied anywhere in the objective). Above rated the objective holds
  # power at THIS number, not at whatever the current blade happens to make at
  # 11 m/s. A nameplate does not get bigger because the blade got better;
  # letting it float credited the optimiser with a larger generator, and that
  # was worth 0.096 of the +0.217 % floating-cap gain (docs/AEP_GAIN_AUDIT.md
  # section 1.2, section 3.2).
  #
  # PROVISIONAL BASIS, recorded so it can be checked, not chosen: this is
  # P_aero(11 m/s; x0), the Schmitz baseline's own aerodynamic power at the
  # rated wind speed under the design TSR and the site atmosphere
  # (verification/baseline/x0.json), at full precision so the baseline's AEP
  # is unchanged by the switch. tests/test_baseline.py asserts the agreement
  # and is retired when a nameplate lands. It stands in for the generator's
  # nameplate rating, which is outstanding input B2 (docs/OUTSTANDING-INPUTS.md
  # section 9). When B2 is answered this value is replaced and every
  # optimisation artefact re-runs; nothing here should be read as "the
  # machine is a 3.8 kW machine".
  #
  # Note added 2026-09-19 with the rotor-speed ceiling below: the basis is
  # P_aero(11 m/s; x0) AT THE DESIGN TSR (lambda = 6.5, 341 rpm), which the
  # test pins as stated. Under the 300 rpm ceiling the rotor runs lambda =
  # 5.71 at 11 m/s, so the baseline's power on the actual schedule at rated
  # wind is a little below this number; the rating is a nameplate and does
  # not move with the schedule.
  rated_power_w: 3822.189755449124

  # Maximum rotor speed, rpm -- outstanding input B1, RESOLVED PROVISIONALLY
  # on 2026-09-19 (after the ceiling cross-evaluation). This is the
  # one machine fact that gives the AEP objective a tip-speed-ratio dimension:
  # the operating law is
  #
  #     lambda(V) = min(design_tsr, Omega_max R / V)
  #
  # i.e. the design TSR below V_c = Omega_max R / design_tsr and constant
  # rotor speed above it (src/objective/power.py). With `null` there is no
  # ceiling and every bin runs at the design TSR -- the pre-2026-09-19
  # objective, kept as the control case (tests/test_operating_law_control.py).
  #
  # At R = 2.0 m, 300 rpm is a tip speed of 62.8 m/s and V_c = 9.67 m/s: only
  # the 10.5 m/s bin runs below the design TSR uncapped, and the measured
  # effect on the optimiser's gain over Schmitz is +0.121 % -> +0.147 %
  # (verification/aep_optimisation_experiment/, run 2026-09-19).
  #
  # PROVISIONAL, WITH A STATED BASIS -- not a measured fact about a specified
  # generator, which is what B1 still asks for:
  #   * Without a ceiling the rotor runs lambda = 6.5 up to rated, i.e.
  #     341 rpm = 71.4 m/s tip speed at 11 m/s. That is above the ~60-65 m/s
  #     noise-conscious upper limit generally applied to residential-scale
  #     small turbines.
  #   * The closest commercial analogue in size and rating (Skystream 3.7,
  #     2.4 kW, 3.72 m rotor) runs to ~330 rpm, ~64 m/s tip speed.
  #     Off-the-shelf direct-drive 3 kW permanent-magnet generators cluster
  #     at 250-300 rpm rated.
  #   * 263 rpm (55 m/s) and 239 rpm (50 m/s) were explicitly NOT chosen.
  #     They are the ceilings that inflate the gain (+2.33 % and +7.84 %,
  #     docs/AEP_GAIN_AUDIT.md section 3.1) and would amount to designing for
  #     an under-sped generator to make the number bigger -- the gimmick the
  #     audit's section 3.5 names. 300 rpm does not flatter the optimiser.
  #   * Open confirmation item (docs/OUTSTANDING-INPUTS.md section 10): the
  #     Kestrel e400 (3 kW, 4.0 m diameter, made in Gqeberha) is the nearest
  #     regional comparable; its datasheet rated rpm should be cited if it
  #     supports ~300 rpm. A confirmation, not a blocker.
  # When a generator is specified, this value is replaced and every
  # optimisation artefact re-runs, exactly as for rated_power_w.
  max_rotor_speed_rpm: 300

# ---------------------------------------------------------------------------
# Parameterisation -- plan section 4
# ---------------------------------------------------------------------------
# Strip count and design-variable count are independent quantities (section
# 4.1); both are recorded so they cannot be conflated by a downstream reader.
# The counts below are the plan's INTENDED configuration -- 25 strips, 10
# geometry parameters. Section 4.3 requires the control-point count to be
# selected by a documented representation study (6/8/10/12/16) rather than
# asserted, so these are the starting configuration for that study, not its
# conclusion.
#
# BOUNDS -- resolved 2026-09-19 (MJ's decision, outstanding input section 2
# and the audit's O4). Applied to the control points, and to the SCALED
# variables through design.bounds.DesignBounds (plan section 7.1). Until
# 2026-09-19 these were TODO here and lived as a provisional set in
# tests/test_parameterisation.py::PROVISIONAL_BOUNDS, with chord_max_m = 0.45
# as a placeholder with no basis; that placeholder is retired.
#
# Three of the four were grounded on 2026-09-13 and are unchanged:
#   chord_min_m   0.045 m  SG6043 10 % t/c at 32.1 % chord -> ~4.5 mm
#                          laminate minimum at the tip.
#   twist_min_deg  -2 deg  Schmitz baseline tip twist 0.57 deg with margin.
#                          NOTE: this bound is ACTIVE at the unconstrained
#                          optimum (the tip-twist control point sits on it
#                          from every start, verification/adjoint_optimisation/).
#   twist_max_deg  35 deg  Schmitz baseline root twist 23.07 deg with margin.
#
# chord_max_m = 0.30 m -- basis:
#   * Local solidity at the root cut-out r = 0.3 m: 0.45 m gives
#     sigma = B c / (2 pi r) = 0.72 (blades nearly touching; BEM's
#     independent-annuli assumption and the Prandtl loss model no longer
#     hold). 0.30 m gives sigma = 0.48, the conventional edge of BEM
#     validity. The radius-aware form of the same limit is the solidity cap
#     below.
#   * c / R = 0.15 is the top of the small-turbine commercial range
#     (~0.08-0.15).
#   * The Schmitz root control point is 276 mm, so the baseline stays
#     feasible and unclipped (docs/AEP_GAIN_AUDIT.md section 3.4) and the
#     fairness argument is unchanged.
#   * Measured to be neither generous nor punitive: at 300 rpm the gain is
#     +0.147 % with either 0.30 or 0.45 m (root bound active, no measurable
#     cost); at 263 rpm, 2.33 % -> 2.28 %.
# Still an engineering judgement rather than a measured hub/attachment
# limit; if a root-attachment concept lands with a different number, this
# value is replaced and the optimisation artefacts re-run.
parameterisation:
  n_bem_strips: 25
  n_control_points_chord: 5
  n_control_points_twist: 5
  bounds:
    chord_min_m: 0.045
    chord_max_m: 0.30
    twist_min_deg: -2.0
    twist_max_deg: 35.0

# ---------------------------------------------------------------------------
# Operating constraints -- plan section 7.4
# ---------------------------------------------------------------------------
# Local solidity cap, sigma_i = B c_i / (2 pi r_i) <= max_local_solidity at
# every BEM station. Resolved 2026-09-19 together with chord_max_m above: it
# is the radius-aware statement of the same BEM-validity limit, linear in the
# design vector (gradients.ScaledProblem.solidity_constraint). 0.5 is the
# conventional edge of the independent-annuli assumption.
#
# Honesty note: with chord_max_m = 0.30 m on the control points and the
# B-spline's convex-hull property (no station chord exceeds the largest
# control point), the cap cannot be reached -- at the first station,
# r = 0.334 m, sigma = 0.5 needs c = 0.350 m. It is wired and reported so
# the artefacts can show it inactive, not because it shapes any result; the
# box bound is what bites at the root.
constraints:
  max_local_solidity: 0.5

# ---------------------------------------------------------------------------
# The mass problem -- docs/PLAN-mass-objective-2026-09-20.md (adopted 2026-09-20)
# ---------------------------------------------------------------------------
# The objective is blade MATERIAL, not energy: minimise the material proxy
# subject to AEP >= AEP(x0), the Phase 4 load cap, a root-stress proxy, a
# tip-deflection proxy and the manufacturability rows below. x0 -- the
# committed Schmitz baseline at design_tsr -- is the reference for every
# relative row (MJ's decision 2026-09-20: the reference lambda stays 6.5; a
# Schmitz designed and tracked at 6.0 scores +0.16 % on this machine, which
# the report states and prices off the energy-material exchange-rate sweep).
#
# mass_model selects the material proxy (src/objective/mass.py):
#   shell   m = rho_lam * t_shell * k_P * int c dr   -- a thin skin of constant
#           laminate thickness, how a hand-laid small blade is built. k_P is
#           the section perimeter per unit chord, exact from the airfoil
#           coordinates (SG6043: 2.0485). THE OBJECTIVE. Linear in the design
#           vector. Self-consistent with the two structural proxies, which
#           assume the same shell: Z ~ c^2 t (root stress), I ~ c^3 t
#           (deflection).
#   solid   m = rho * k_A * int c^2 dr -- a solid or t/c-scaled section; k_A
#           the section area per unit chord squared (SG6043: 0.0685). The
#           literature's "blade volume" proxy. REPORTED beside the shell
#           figure, never optimised (the scratch runs of 2026-09-19 showed the
#           c^2 proxy is the one a wavy planform games).
# Both are exact geometry; neither says whether the blade survives its loads,
# which is what the relative stress and deflection rows are for. The
# headline is a percentage of x0's material and is independent of density.
objective:
  mass_model: shell

# Manufacturability (plan section 7.2, amended 2026-09-20): the chord and
# twist CONTROL POINTS are non-increasing from root to tip. For a B-spline
# that implies a non-increasing curve (variation-diminishing property), so
# these four + four linear rows with a constant Jacobian are the whole
# manufacturability set. Needed: without them the mass objective moves area
# between control points regardless of shape (scratch: 281/45/165/56/54 mm at
# the -2 % energy floor). The root cut-out at 0.15 R sits beyond the physical
# chord peak, so monotone-from-the-hub is the realistic shape, not a
# restriction. They cost 0.06 % of the material saving at delta = 0.
#
# min_chord_m (2026-09-20, afternoon, MJ's decision -- "decision 6" in
# docs/PLAN-mass-objective-2026-09-20.md): the BUILDABLE-TIP FLOOR of the mass
# problem, five linear rows c_i - min_chord_m >= 0 on the chord control points
# beside the monotone rows. It is deliberately NOT the box bound
# parameterisation.bounds.chord_min_m (0.045 m): the box sets the scaling of
# the design variables, and every committed Phase 1-4 gradient and
# optimisation artefact (h*_j, eps_j, the red test's FD reference, x*, x_c)
# was measured in that scaling -- moving the box would invalidate all of them
# (the 2026-09-19 chord_max_m change re-ran the whole chain). A row leaves
# them untouched and states the same thing.
#   Why 0.060: the 45 mm box floor was grounded on 2026-09-13 as "SG6043 10 %
#   t/c -> ~4.5 mm laminate minimum", which is the thickness of the WHOLE
#   section -- a 45 mm chord is 4.5 mm thick in total, with no room for two
#   skins, a bond line and a web -- and the first mass optimum sat on it
#   (-4.24 % shell with a 45 mm tip and a 6:1 taper). 60 mm is a 6 mm
#   section (two 2 mm skins + bond + web) and stays BELOW the Schmitz x0 tip
#   (67 mm), so x0 and every reference measured from it are unchanged and the
#   comparison stays fair. Measured alternatives (misc/blade_shape_experiment,
#   scratch, journal 2026-09-20 afternoon): 80 mm is infeasible at delta = 0
#   by 0.002 % and saves 0.8 % at delta = 0.5 % against an unfloored Schmitz
#   (a fair 80 mm study would re-fit x0 under the same floor); a taper-ratio
#   row and chord-convexity rows were slack at every floored optimum and are
#   not added. Phase 4's x_c (tip 47.7 mm) predates the floor and is kept as
#   the energy reference, evaluated only. A laminate concept replaces this
#   number.
manufacturing:
  monotone_chord: true
  monotone_twist: true
  min_chord_m: 0.060

# Structural inputs -- ALL TODO, and NONE of them gates the production run.
# Every structural row is relative to x0 (material, stress proxy, deflection
# proxy), so the laminate density, thickness and modulus cancel exactly as the
# material allowable does in the Phase 4 constraint. They exist so that a kg
# figure can be quoted from the same code the moment a laminate concept is
# chosen (mass_kg = rho_lam * t_shell * shell_area), never so that a number is
# invented here. docs/OUTSTANDING-INPUTS.md section 7.3.
structure:
  laminate_density_kg_m3: "TODO: no laminate concept chosen (2026-09-20); needed only to quote kg, not for any constraint"
  shell_thickness_m: "TODO: no laminate concept chosen (2026-09-20); needed only to quote kg, not for any constraint"

# Sanity band for the AEP module (plan section 1.4). A result far outside this
# indicates a bug, not a discovery. Recorded so the check reads it rather than
# restating it.
#
# WIDENED 4-6 -> 8-12 MWh/yr on 2026-09-13, ON MJ'S EXPLICIT INSTRUCTION, after
# the wind resource landed and the band could be evaluated for the first time.
# The baseline returns 10.27 MWh/yr. MJ's reasoning, recorded as given: if the
# blade already makes substantially more power than the original band, the
# original band was simply too narrow.
#
# This is a deliberate revision of a stated expectation, which the repo's
# ground rule 5 otherwise forbids -- so the basis is written out here rather
# than left as a pair of round numbers.
#
# WHY 4-6 WAS WRONG. Two independent defects, both predating the 2026-09-13
# data:
#
#   1. It compared different quantities. 4-6 came from a capacity factor of
#      0.15-0.22 on plan 1.4's ~3.1 kW rating, and that rating carries
#      `eta = 0.90` and assumes `Cp = 0.42`. The AEP model produces
#      AERODYNAMIC shaft energy -- src/objective/power.py applies no generator,
#      gearbox or electrical efficiency and says so -- at the solver's actual
#      design-point `Cp` of 0.472. Rated aerodynamic power is 3.82 kW, not
#      3.1 kW.
#   2. It was never consistent with plan 1.3's own resource prior. At the
#      CALMEST corner of `k ~ 1.8-2.4, c ~ 6-7 m/s` this rotor already returns
#      5.9 MWh/yr, and at the middle of that range 7.7. The band could not have
#      been met by the design it was written for, under the resource the same
#      plan expected. Nobody noticed because the resource was TODO, so the band
#      was never once evaluated.
#
# HOW 8-12 WAS DERIVED -- not chosen to admit 10.27:
#
#   Lower/upper from the resource uncertainty this project has actually
#   recorded. Varying the site pair by +/-10 % on both `c` and `k` spans
#   8.21-12.01 MWh/yr; the log-law roughness band on the height extrapolation
#   (c = 7.049-7.633 m/s at 20 m, verification/wind_resource/) spans
#   9.73-11.10 and sits comfortably inside. Rounded outward to 8-12.
#
#   Equivalent capacity factor 0.24-0.36 on the 3.82 kW aerodynamic rating.
#
# IT IS STILL A CHECK, WHICH IS THE POINT OF WIDENING IT CAREFULLY. Verified
# against plausible failure modes -- each of these lands OUTSIDE 8-12:
#
#     rated-power limiting not applied      14.63
#     sea-level density used (1.225)        ~12.99
#     bin masses not from the CDF           12.86
#     any factor-of-two error                5.14 or 20.54
#
# A band wide enough to admit anything would be a note, not a check. This one
# still fails on every bug the old one would have caught.
#
# WHAT IT DOES NOT SETTLE: whether the Phase 1 exit criterion should be stated
# in aerodynamic or delivered electrical energy. This band is aerodynamic,
# matching what the model computes. If the report wants electrical, an `eta`
# has to enter the chain and this band moves with it. See
# docs/OUTSTANDING-INPUTS.md and the 2026-09-13 journal entry.
sanity:
  aep_mwh_per_year_min: 8.0
  aep_mwh_per_year_max: 12.0
