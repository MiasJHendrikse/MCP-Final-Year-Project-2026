# SG6043 polar cache -- the design rotor's cache. PROJECT_PLAN.md section 3.3.
#
# BUILT 2026-09-10. data/polars/sg6043/README.md has the full account: gap
# closure, Viterna stitch measurement, and -- the piece S809 has no
# equivalent of -- validation against real UIUC LSAT measurements. Both
# inputs the build was blocked on were landed first (remediation work order,
# ground rule 3 -- neither was invented):
#
#   * the SG6043 coordinates -- LANDED 2026-08-29 as data/airfoils/sg6043.dat,
#     fetched verbatim from the UIUC coordinate database and geometry-verified
#     against published thickness/camber (see data/airfoils/README.md);
#   * n_crit -- LANDED 2026-09-09, selected by plan 1.2's sensitivity study
#     (python -m validation.ncrit_sensitivity, results/ncrit_sensitivity/).
#     S809's Ncrit = 5 is a result about a 21 % thick section at low Re and
#     does not transfer; this cache's own calibration is `build.ncrit` below.
#
# Read only through `src/config` (config.load_polar_cache("sg6043")).

name: sg6043
airfoil: SG6043
directory: data/polars/sg6043
description: >-
  XFOIL polar cache for the SG6043, covering the Khomas Hochland design
  rotor's per-station Reynolds envelope across the cut-in to cut-out wind
  sweep. Independent of the S809 cache; the two do not interact.

build:
  ncrit: 9.0
  # Selected 2026-09-09 by python -m validation.ncrit_sensitivity, sweeping
  # {5,7,9,11,13} against the UIUC clean-model data at Re=100k-500k (the same
  # alpha range and n_panel this build section specifies). Full results,
  # per-Reynolds breakdown and the reasoning for picking 9 over the script's
  # own naive mean-aggregate pick of 11 are in results/ncrit_sensitivity/README.md.
  # Short version: 9 wins 4 of the 6 individual Reynolds comparisons
  # (100k/200k/300k/400k) against 11's 2 (150k/500k), it is the value that
  # wins across the low-Re band closest to this cache's unmeasured 40k-100k
  # floor, and -- unlike S809's atmospheric-turbulence-motivated Ncrit=5 --
  # 9 is XFOIL's own clean-wind-tunnel default, which is the physically
  # expected match when validating against a wind-tunnel dataset.
  #
  # n_crit in {5,7,13} were NOT ruled out on merit -- each hit a 400s sweep
  # timeout at exactly one Reynolds number and is incompletely characterized,
  # not disqualified. n_crit=13 in particular scored best of anything in the
  # table at Re=300k. See the README's "What this study did not settle"
  # section before treating 9 as unconditionally final.
  n_panel: 240      # as for S809: resolves the leading-edge suction peak.
                    # Not a calibration choice -- panel count is a
                    # discretisation setting, not a transition model.
  alpha_min_deg: -8.0
  alpha_max_deg: 18.0
  alpha_step_deg: 0.5
  # Reynolds bounds: see `reynolds_envelope` below for the derivation. 40k
  # floor against a computed minimum of 49.4k (19 % margin); 1.0M ceiling
  # against a computed maximum of 854k (17 % margin). Spacing is finer at the
  # low end, where dCd/dRe is steepest and where the design rotor actually
  # lives, and the interpolant of work order Task 3 works in log(Re), so even
  # ratios matter more than even differences.
  reynolds:
    - 40000
    - 60000
    - 80000
    - 100000
    - 150000
    - 200000
    - 300000
    - 400000
    - 500000
    - 600000
    - 700000
    - 800000
    - 1000000

# ---------------------------------------------------------------------------
# Reynolds envelope -- work order Task 2, item 0
# ---------------------------------------------------------------------------
# Computed by `python -m polars.envelope` (from src/), which derives it from
# config/rotor_design.yaml and config/site.yaml alone. Established BEFORE any
# SG6043 polar is generated, because work order Task 4 removes the Reynolds
# clamp and makes an out-of-range lookup raise: a cache floor above the real
# envelope would turn a silent wrong answer into a hard crash across the
# low wind-speed bins, which carry most of this site's AEP.
#
# Method: Re = W c / nu with W = hypot(V, Omega r), over
#   * 25 stations over r/R = 0.15..1.0 plus the tip;
#   * every 1 m/s wind bin from cut-in (3) to cut-out (20);
#   * Schmitz optimum chord at C_L = 1.0 -- plan 1.4's own basis for choosing
#     R = 2.0 m -- perturbed by 0.7, 1.0 and 1.4;
#   * three rotor-speed schedules (see `cases`).
#
# The chord band is an assumption, not a config value: plan 7.1's chord bounds
# are unset, so a stand-in is needed and is stated rather than hidden. It
# covers the design-lift lever the plan records (chord scales as 1/C_L, so
# C_L in 0.71..1.43 is the same band) and any plausible optimiser excursion.
# Recompute when 7.1 fixes real bounds.
reynolds_envelope:
  computed_by: python -m polars.envelope
  computed_on: 2026-08-29
  kinematic_viscosity: 1.8690e-5     # site.yaml, 1800 m -- NOT sea level
  chord_model: Schmitz optimum at C_L = 1.0, factors [0.7, 1.0, 1.4]
  overall_min: 49413      # below-rated, V = 3 m/s, r/R = 0.17, c = 0.236 m
  overall_max: 854069     # unregulated, V = 20 m/s, r/R = 1.00, c = 0.121 m
  cases:
    below_rated:          # variable speed, lambda = 6.5 +/- 1.5
      min: 49413
      max: 575863
    above_rated:          # rotor speed held at its rated value
      min: 214027
      max: 588992
    unregulated:          # constant lambda to cut-out -- not a sensible
      min: 55980          # machine, but exactly what
      max: 854069         # bem.powercurve.power_curve(tsr=...) computes today,
                          # so a cache that does not cover it would raise
                          # rather than answer
  notes: >-
    The floor is set at the inboard station at cut-in, not at the tip: at the
    low end of the tip-speed-ratio band the root sees little relative velocity
    despite its large chord. Rows below Re = 60k sit outside the UIUC
    Low-Speed Airfoil Tests range (60k, 100k, 200k, 300k) and inherit the
    low-Re XFOIL uncertainty plan 3.3 names as a dominant error source; they
    are cached to keep the envelope covered, not because they are as
    trustworthy as the rest. The 49k-854k span is the envelope this cache was
    sized against -- a synthetic Schmitz chord model and an unregulated
    constant-lambda law held to cut-out, neither of which is the machine that
    is built. Under the committed 300 rpm operating law the three committed
    blades occupy 62k-339k, with x0 at 73 170-313 659 over all 17 bins
    (`verification/mass_optimisation/reference_blades.json` ->
    reynolds_all_bins), so the cache's coverage is conservative by a factor of
    about 2.5 at the top.

# ---------------------------------------------------------------------------
# Post-stall extrapolation -- work order Task 2, item 3
# ---------------------------------------------------------------------------
# The +/-180 deg extension is written at build time (polars.viterna). CD_MAX
# for this cache is DERIVED from the blade's aspect ratio through Viterna &
# Corrigan's 1.11 + 0.018 AR, not carried over from the S809 cache's fitted
# 1.8: that value was matched to QBlade for a 10 m NREL rotor and has no
# bearing on a 2 m blade. The reversed-flow lift amplitude follows from it as
# negative_cl_scale * CD_MAX / 2 (see polars/viterna.py).
extrapolation:
  aspect_ratio: 11.7        # R / mean Schmitz chord, python -m polars.envelope
  cd_max: 1.3206            # 1.11 + 0.018 * 11.7, exact -- matches what
                            # xfoil.build_polar_cache.AIRFOILS["sg6043"]
                            # actually computes via cd_max_finite_blade(11.7)
  negative_cl_scale: 0.7    # retained convention, see polars/viterna.py
  recompute_when: the design chord distribution is fixed

known_gaps: []      # all 79 holes found were closed -- none remain open.
                    # See `filled_alphas` below and the cache README's
                    # "Interior holes" table for the per-Reynolds breakdown;
                    # full per-point detail is
                    # results/polar_cache/sg6043_gap_closure.json.

# How each former hole was closed, S809-README convention. 79 total after the
# main sweep's own retry pass: 4 by a further XFOIL retry, 75 by local
# quadratic fit (source=2, never source=0). Listed by Reynolds number rather
# than per-alpha (unlike S809's 8) because of the count; see the JSON above
# for every (Re, alpha) pair. Every hole sits at a curve's stall shoulder or
# deep-negative-alpha extreme, outside the rated-operation Reynolds band
# (~150k-450k).
filled_alphas_by_re:
  - {reynolds: 40000, n_gap_retry: 0, n_local_fit: 4}
  - {reynolds: 60000, n_gap_retry: 0, n_local_fit: 10}
  - {reynolds: 80000, n_gap_retry: 1, n_local_fit: 8}
  - {reynolds: 100000, n_gap_retry: 3, n_local_fit: 2}
  - {reynolds: 150000, n_gap_retry: 0, n_local_fit: 2}
  - {reynolds: 200000, n_gap_retry: 0, n_local_fit: 8}
  - {reynolds: 300000, n_gap_retry: 0, n_local_fit: 8}
  - {reynolds: 400000, n_gap_retry: 0, n_local_fit: 7}
  - {reynolds: 500000, n_gap_retry: 0, n_local_fit: 7}
  - {reynolds: 600000, n_gap_retry: 0, n_local_fit: 3}
  - {reynolds: 700000, n_gap_retry: 0, n_local_fit: 6}
  - {reynolds: 800000, n_gap_retry: 0, n_local_fit: 6}
  - {reynolds: 1000000, n_gap_retry: 0, n_local_fit: 4}
# Notable: Re=60k's negative-leg/stall-tail hang, flagged as a real risk
# before this build (main sweep's bidirectional strategy losing its negative
# leg entirely), did not materialise at that scale -- 12 gap-retry points
# during the main build (counted separately, above table is close_polar_gaps
# only) plus the 10 local-fit points above, a bounded gap not a large swath.
# Re=100k carries the cache's worst upper-stitch slope kink (+0.5685 /deg,
# 518% of the thin-airfoil slope) and the largest Check 2 violation -- same
# Reynolds number as S809's own worst-case row. See README.

history:
  - date: 2026-08-29
    change: >-
      specified -- Reynolds envelope computed and bounds set with margin
      (work order Task 2, item 0). No polars generated: coordinates and
      n_crit are still outstanding.
  - date: 2026-09-09
    change: >-
      n_crit calibrated to 9.0 by the sensitivity study (plan 1.2); see
      build.ncrit above and results/ncrit_sensitivity/README.md for the full
      comparison and the reasoning for overriding the study script's own
      naive pick of 11. n_crit in {5,7,13} left incompletely characterized
      (sweep timeouts at one Re each, not disqualified on merit) -- flagged
      in the README for anyone revisiting this calibration later. Cache
      still not built.
  - date: 2026-09-10
    change: >-
      Cache built: 13/13 Reynolds numbers, no NaN after gap closure (79
      holes: 4 XFOIL retry, 75 local fit), extended to +/-180 by Viterna at
      cd_max=1.3206. validate_polars: 3/5 (checks 2 and 5 fail on a real,
      located low-Re laminar-separation-bubble effect at Re<=200k, not a
      build defect -- see README). Validated against real UIUC LSAT
      measurements for the first time (compare_sg6043_uiuc.py): mean Cl RMSE
      0.0914, Cd RMSE 0.00856 over the six shared Reynolds numbers, improving
      monotonically with Re. Stitch continuity measured, real kinks present
      at both stitches (see README), same characterisation Task 3 needs.

validation:
  script: python -m validation.validate_polars sg6043
  status: >-
    built, 3/5 (checks 2 and 5 fail on a documented, located low-Re LSB
    effect -- see data/polars/sg6043/README.md, not tuned away per ground
    rule 5)
  uiuc_comparison:
    script: python -m validation.compare_sg6043_uiuc
    mean_cl_rmse: 0.0914
    mean_cd_rmse: 0.00856
    note: >-
      Improves monotonically with Re (Cl RMSE 0.1442 at 100k to 0.0240 at
      500k). Full per-Reynolds table, provenance breakdown and comparison
      plots: results/sg6043_uiuc_validation/.
  residual: >-
    Checks 2 and 5 fail because of a real, XFOIL-converged (not filled)
    laminar-separation-bubble burst at Re=40k (Cl jumps 1.114->1.429 between
    alpha=8.5 and 9.0 deg) that weakens with rising Re, plus the same effect's
    aggregate signature in Cl_max non-monotonicity (dips to 1.646 at 300k,
    matching the n_crit study's own free-transition sanity check within
    0.008) and Cl(0) varying 0.638 across the range. Corroborated by the UIUC
    comparison above showing the largest measured-vs-computed error at
    exactly this low-Re band. See data/polars/sg6043/README.md for the full
    account.
  low_re_caveat: >-
    Nothing below Re = 100k has experimental support. The cache floor is 40k
    because the design envelope reaches 49.4k at the root at cut-in, so the
    40k-80k rows are XFOIL alone, in the regime where XFOIL is least
    trustworthy, and the n_crit study could only validate 100k-500k and must
    assume the calibration carries downward. Name this in the limitations
    chapter (plan 3.3, risk R4).
